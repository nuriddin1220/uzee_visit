{% load static %}
{% load translation_tags %}
{% load date_tags %}


<div class="row mt-4">
{% if files %}
        {% for item in files %}
    <div class="col-lg-4 col-md-4 col-sm-6 col-12 mb-4">
        <div 
            style="
                background:#f7f8fa;
                padding:22px;
                border-radius:6px;
                height:100%;
            "
        >
            <div class="d-flex align-items-start gap-3">
                <img 
                    src="{% static 'assets/img/icon/file_icon.png' %}"
                    alt="file"
                    style="
                        width:42px;
                        height:42px;
                        object-fit:contain;
                        min-width:42px;
                    "
                />
                <div>
                    <h6 style="line-height:1.6;margin-bottom:8px;">
                        {{ item.title }}
                    </h6>
                    <a 
                        href="{{ item.file.url }}"
                        target="_blank"
                        class='fw-lighter text-primary'
                    >
                        {% t "general.download" %}
                        <i class="fa fa-download"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
        {% else %}
        <div class="text-center py-5">
            <h5 class="text-muted">
                {% t "general.no_files_attached" %}
            </h5>
        </div>

        {% endif %}

</div>
