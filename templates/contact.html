{% extends "index.html" %}

{% load static %}
{% load translation_tags %}
{% block content %}
<!-- START SECTION TOP -->
		<section class="section-top" style="background-image: url('{% static "assets/img/bg/section-top.png" %}'); background-size:cover; background-position:center center;"
			<div class="container">
				<div class="row">
				  <div class="col-lg-12 col-sm-12 col-xs-12 text-center">
					<div class="section-top-title">
						<h1>{% t "contact.lets_talk" %}</h1>
					</div>
				  </div><!--- END COL -->				  
				</div><!--- END ROW -->
			</div><!--- END CONTAINER -->
		</section>
		<!-- END SECTION TOP -->
		
		<!-- START ADDRESS -->
		<section class="address_area section-padding">
			<div class="container">
				<div class="row justify-content-center text-center">
				  <div class="col-lg-4 col-sm-4 col-xs-12 text-center">
					<div class="single_address">
						<h4>{{ title }}</h4>
                        <p class="mr_20">{{ address|linebreaksbr }}</p>
                        <p><a href="tel:{{ contact.phone }}">{{ contact.phone }}</a></p>
                        <p><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></p>
					</div>
				  </div><!--- END COL -->				  
				</div><!--- END ROW -->
			</div><!--- END CONTAINER -->
		</section>
		<!-- END ADDRESS -->
		
		<!-- START MAP -->
		<div 
             class="map wow fadeInUp mx-1" 
                data-wow-duration="1s" 
                data-wow-delay="0.2s"
                style="
                    overflow:hidden;
                    border-radius:15px;
                ">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d456.78426487489656!2d69.31466548212732!3d41.271768973486516!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38ae5f25fcd456bb%3A0x661d468506055b3d!2z0JDQniDCq09gWkVORVJHT0lOSklOSVJJTkfCuw!5e1!3m2!1sen!2s!4v1779615320980!5m2!1sen!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
		</div>	
		<!-- START MAP -->		

		
{% endblock %}
